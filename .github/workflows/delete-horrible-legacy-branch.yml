name: Delete legacy Horrible branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-horrible-legacy-branch.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy Horrible branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init tmp
          cd tmp
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/anhdaijka/novel-os.git"
          git push origin --delete story/horrible-development
