name: Novel OS stress

on:
  push:
    paths:
      - 'scripts/**'
      - 'config/upstreams.json'
      - 'package.json'
      - '.github/workflows/novel-os-stress.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/upstreams.json'
      - 'package.json'
      - '.github/workflows/novel-os-stress.yml'
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run isolated three-chapter lifecycle test
        run: npm run stress:test
